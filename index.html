<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Optimizer</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong palette. Light is the default; the OS preference is only consulted
      // on a first visit, when nothing has been stored yet.
      (function () {
        try {
          var stored = localStorage.getItem('scheduler.theme');
          if (!stored) {
            stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', stored);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
